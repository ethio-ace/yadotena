# Optional uptime ping for the Django API's cheap /health/ endpoint.
# Only needed if the API host sleeps when idle. Set repository secret or
# variable API_HEALTH_URL (e.g. https://semu.ethioace.com/health/) to enable;
# without it the job is a no-op.

name: API Keep Alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health/
        env:
          URL: ${{ secrets.API_HEALTH_URL || vars.API_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "API_HEALTH_URL not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 "$URL"
          echo
