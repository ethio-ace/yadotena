<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <title>Hilif Milk &amp; Foods</title>
  <g transform="translate(8 8)">
  <rect width="64" height="64" rx="15" fill="#006746"/>
  <!-- Milk drop (shemma white) -->
  <path d="M32 6.5C29 11 16 24.5 16 36.5a16 16 0 0 0 32 0C48 24.5 35 11 32 6.5z" fill="#fbfaf6"/>
  <!-- the h, cut from the milk -->
  <path d="M27 23v22.5M27 37a5.5 5.5 0 0 1 11 0v8.5" stroke="#006746" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- a drop of butter-gold where the h's dot of light falls -->
  <circle cx="38.6" cy="26.4" r="2.3" fill="#e6a313"/>
  <!-- tibeb: the woven band of the shemma -->
  <rect x="14" y="55.5" width="36" height="3" rx="1.5" fill="#e6a313"/>
  <rect x="21" y="55.5" width="3" height="3" fill="#da5042"/>
  <rect x="30.5" y="55.5" width="3" height="3" fill="#da5042"/>
  <rect x="40" y="55.5" width="3" height="3" fill="#da5042"/>
  </g>
  <text x="88" y="45" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-1" fill="#1c1916">Hilif<tspan dx="10" font-family="'Noto Sans Ethiopic', 'Noto Serif Ethiopic', 'Droid Sans Ethiopic', sans-serif" font-size="20" font-weight="700" letter-spacing="0" fill="#e6a313">ሂሊፍ</tspan></text>
  <text x="89" y="66" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.2" fill="#006746">MILK &amp; FOODS</text>
</svg>
