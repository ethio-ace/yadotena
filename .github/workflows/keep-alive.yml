# Pings the Render API /health every ~14 minutes to reduce free-tier cold sleeps.
# Optional override: repository secret or variable RENDER_HEALTH_URL
# Default: https://yadotena.onrender.com/health
#
# Prefer cron-job.org for a purpose-built HTTP scheduler; this workflow is a backup
# that lives in-repo. Scheduled Actions can be delayed under GitHub load.

name: API Keep Alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL || vars.RENDER_HEALTH_URL }}
        run: |
          URL="${RENDER_HEALTH_URL:-https://yadotena.onrender.com/health}"
          echo "Pinging $URL"
          curl --fail --silent --show-error --max-time 30 "$URL"
          echo
