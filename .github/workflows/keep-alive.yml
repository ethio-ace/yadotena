# Pings the Render API /health every ~14 minutes to reduce free-tier cold sleeps.
# Set repository secret (or variable) RENDER_HEALTH_URL = https://YOUR-SERVICE.onrender.com/health
#
# Prefer cron-job.org for a purpose-built HTTP scheduler; this workflow is a backup
# that lives in-repo. Scheduled Actions can be delayed under GitHub load.

name: API Keep Alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          URL: ${{ secrets.RENDER_HEALTH_URL || vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Set secret or variable RENDER_HEALTH_URL (e.g. https://yadotena-api.onrender.com/health)"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 "$URL"
          echo
